name: Marabagam Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-and-secret-check:
    name: Secret & Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Secret Scanning (Gitleaks)
        run: gitleaks git . --verbose

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Dependency Audit
        run: cd frontend && npm audit --audit-level=high || true

  frontend-check:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci || npm install

      - name: TypeScript Type Check
        run: cd frontend && npx tsc --noEmit

      - name: Run Frontend Tests
        run: cd frontend && npm test -- --run

      - name: Build Production Frontend
        run: cd frontend && npm run build

  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests
        run: cd backend && ./mvnw test

  ai-service-check:
    name: AI Service Test & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI Service Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Dependency Security Audit
        run: |
          cd ai-service
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Run Pytest
        run: cd ai-service && pytest

  docker-and-sbom-check:
    name: Production Container & SBOM Verification
    runs-on: ubuntu-latest
    needs: [security-and-secret-check, frontend-check, backend-check, ai-service-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy env template
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "MARABAGAM_CERTIFICATE_SECRET=$(openssl rand -hex 32)" >> .env

      - name: Validate Production Docker Compose Config
        run: docker compose -f deployment/docker-compose.prod.yml config

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: marabagam-sbom.json

      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
