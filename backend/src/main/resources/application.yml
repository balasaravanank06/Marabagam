server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: marabagam-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marabagam_db}?sslmode=prefer
    username: ${DB_USERNAME:marabagam_user}
    password: ${DB_PASSWORD:marabagam_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.marabagam: DEBUG
    org.springframework.security: INFO
