server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: marabagam-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:marabagam_prod_db}?sslmode=prefer
    username: ${DB_USERNAME:marabagam_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: MarabagamHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

marabagam:
  certificate:
    secret: ${MARABAGAM_CERTIFICATE_SECRET}
    public-base-url: ${PUBLIC_BASE_URL:https://marabagam.org}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://marabagam.org,https://www.marabagam.org}

ai-service:
  url: ${AI_SERVICE_URL:http://ai-service:8000}

logging:
  level:
    root: WARN
    com.marabagam: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
