# Production Docker Compose Override Manifest for Marabagam
# Canonical Path: deployment/docker-compose.prod.yml
#
# Production Security Exposure:
#   - 80 (HTTP) -> Nginx Reverse Proxy (redirect to HTTPS)
#   - 443 (HTTPS) -> Nginx Reverse Proxy (TLS Termination)
# Internal Network ONLY (marabagam-prod-net):
#   - PostgreSQL (5432) -> Private internal
#   - FastAPI AI Service (8000) -> Private internal
#   - Spring Boot API (8080) -> Private internal

services:
  postgres:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - marabagam-prod-net
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marabagam_db
      DB_USERNAME: marabagam_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MARABAGAM_CERTIFICATE_SECRET: ${MARABAGAM_CERTIFICATE_SECRET}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://marabagam.org}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - marabagam-prod-net
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      PORT: 8000
      AI_WORKERS: ${AI_WORKERS:-4}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: marabagam_db
      DB_USER: marabagam_user
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://marabagam.org}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - marabagam-prod-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    ports: !reset []
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://marabagam.org/api/v1}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - marabagam-prod-net
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  nginx-proxy:
    image: nginx:alpine
    container_name: marabagam-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - marabagam-prod-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  marabagam-prod-net:
    name: marabagam-prod-net
    driver: bridge

volumes:
  postgres_prod_data:
  letsencrypt_certs:
  certbot_www:
