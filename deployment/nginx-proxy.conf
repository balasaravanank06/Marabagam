# Marabagam Edge Gateway Nginx Reverse Proxy Configuration
limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP Server Block - ACME Challenge & SSL Redirect
server {
    listen 80;
    listen [::]:80;
    server_name marabagam.org www.marabagam.org localhost;

    # Let's Encrypt HTTP-01 ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block - SSL Termination & Reverse Proxy Routing
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marabagam.org www.marabagam.org localhost;

    # TLS Certificate Paths (Let's Encrypt volume mount or self-signed dev fallback)
    ssl_certificate /etc/letsencrypt/live/marabagam.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marabagam.org/privkey.pem;

    # Strong TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Code-Inspected Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://api.marabagam.org; media-src 'self' blob:; frame-ancestors 'none';" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Frontend Single-Page Application (Proxy to frontend container)
    location / {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTML No-Cache Strategy for Instant Deployment Updates
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed Frontend Static Assets Caching Strategy
    location /assets/ {
        proxy_pass http://frontend:80/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 1-Year Immutable Cache for Hashed Bundles
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Rate-Limited Login Endpoint
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:8080/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Proxying
    location /api/v1/ {
        limit_req zone=ip_limit burst=20 nodelay;
        proxy_pass http://backend:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Internal Health Probes
    location /actuator/health/ {
        proxy_pass http://backend:8080/actuator/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
