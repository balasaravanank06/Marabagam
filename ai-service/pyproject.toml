[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marabagam-ai"
version = "1.0.0"
description = "Marabagam AI Microservice — Python FastAPI & Pydantic Foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.112.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.2",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
