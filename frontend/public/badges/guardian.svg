<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad6" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="templeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="borderGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad6)" stroke="url(#borderGrad6)" stroke-width="3.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Ancient Temple Gopuram Architecture Silhouette -->
  <g transform="translate(60,58)">
    <!-- Kalasam Finial on Top -->
    <path d="M-2,-30 L2,-30 L1,-34 L-1,-34 Z" fill="#fef08a"/>
    <circle cx="0" cy="-35" r="2" fill="#ffffff"/>
    
    <!-- Tier 1 (Apex) -->
    <polygon points="-8,-24 8,-24 12,-18 -12,-18" fill="url(#templeGrad)" stroke="#78350f" stroke-width="1"/>
    
    <!-- Tier 2 -->
    <polygon points="-12,-16 12,-16 16,-8 -16,-8" fill="url(#templeGrad)" stroke="#78350f" stroke-width="1"/>
    
    <!-- Tier 3 -->
    <polygon points="-16,-6 16,-6 20,4 -20,4" fill="url(#templeGrad)" stroke="#78350f" stroke-width="1"/>

    <!-- Base Gateway / Pillars -->
    <rect x="-22" y="6" width="44" height="18" fill="#854d0e" stroke="#fde047" stroke-width="1.5"/>
    <!-- Sacred Archway Entrance -->
    <path d="M-8,24 L-8,14 C-8,10 8,10 8,14 L8,24 Z" fill="#0f172a"/>

    <!-- Protective Guardian Shield Wings -->
    <path d="M-22,6 C-30,-6 -34,-16 -28,-22 C-22,-24 -18,-18 -18,-12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M22,6 C30,-6 34,-16 28,-22 C22,-24 18,-18 18,-12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Sacred Star -->
  <polygon points="60,20 61,23 64,23 61,25 62,28 60,26 58,28 59,25 56,23 59,23" fill="#ffffff"/>
</svg>
