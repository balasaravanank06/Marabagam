<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="55%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="borderGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad5)" stroke="url(#borderGrad5)" stroke-width="3.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>

  <!-- Blazing Sacred Flame (Agni) -->
  <g transform="translate(60,62)">
    <!-- Outer Flame -->
    <path d="M0,-36 C10,-24 22,-14 22,6 C22,22 10,28 0,28 C-10,28 -22,22 -22,6 C-22,-12 -8,-24 0,-36 Z" fill="url(#flameGrad)" filter="drop-shadow(0 0 8px rgba(245,158,11,0.5))"/>

    <!-- Inner Flame Tongue -->
    <path d="M0,-24 C6,-16 12,-8 12,6 C12,16 6,20 0,20 C-6,20 -12,16 -12,6 C-12,-8 -4,-16 0,-24 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Bold '7' Emblem -->
    <text x="0" y="10" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#7f1d1d" text-anchor="middle" filter="drop-shadow(0 1px 2px rgba(255,255,255,0.8))">7</text>
  </g>

  <!-- Days Pill at Bottom -->
  <g transform="translate(60,94)">
    <rect x="-24" y="-8" width="48" height="16" rx="8" fill="#7f1d1d" stroke="#fde047" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="1">DAYS</text>
  </g>
</svg>
