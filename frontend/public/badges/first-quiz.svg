<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="3.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#ca8a04" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Laurel Wreath -->
  <g stroke="url(#goldGrad2)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Left Wreath -->
    <path d="M32,66 C30,50 36,36 46,28"/>
    <path d="M30,58 C24,56 22,50 26,46"/>
    <path d="M34,46 C28,42 28,34 34,32"/>
    <path d="M40,36 C36,30 38,24 44,24"/>

    <!-- Right Wreath -->
    <path d="M88,66 C90,50 84,36 74,28"/>
    <path d="M90,58 C96,56 98,50 94,46"/>
    <path d="M86,46 C92,42 92,34 86,32"/>
    <path d="M80,36 C84,30 82,24 76,24"/>
  </g>

  <!-- Palm Leaf Scroll / Quill / Checkmark Motif -->
  <g transform="translate(60,62)">
    <!-- Scroll Base -->
    <rect x="-18" y="-16" width="36" height="28" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    <!-- Scroll Text Lines -->
    <line x1="-12" y1="-8" x2="6" y2="-8" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="4" x2="2" y2="4" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

    <!-- Bold Victory Checkmark -->
    <circle cx="14" cy="12" r="10" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
    <path d="M9,12 L13,16 L19,8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Star at Top -->
  <polygon points="60,18 62,23 68,23 63,27 65,32 60,29 55,32 57,27 52,23 58,23" fill="#fef08a"/>
</svg>
