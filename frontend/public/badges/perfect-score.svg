<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad3)" stroke="url(#borderGrad3)" stroke-width="3.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="1,3" opacity="0.8"/>

  <!-- Radiant Sunburst Beams -->
  <g stroke="#facc15" stroke-width="1.5" opacity="0.4">
    <line x1="60" y1="20" x2="60" y2="14"/>
    <line x1="60" y1="100" x2="60" y2="106"/>
    <line x1="20" y1="60" x2="14" y2="60"/>
    <line x1="100" y1="60" x2="106" y2="60"/>
    <line x1="32" y1="32" x2="27" y2="27"/>
    <line x1="88" y1="88" x2="93" y2="93"/>
    <line x1="32" y1="88" x2="27" y2="93"/>
    <line x1="88" y1="32" x2="93" y2="27"/>
  </g>

  <!-- Royal Tamil Gem Crown / Diamond Star -->
  <g transform="translate(60,56)">
    <!-- Crown Base -->
    <path d="M-22,14 L22,14 L18,22 L-18,22 Z" fill="#b45309" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="-12" cy="18" r="2" fill="#ef4444"/>
    <circle cx="0" cy="18" r="2.5" fill="#3b82f6"/>
    <circle cx="12" cy="18" r="2" fill="#22c55e"/>

    <!-- Crown Points -->
    <path d="M-22,14 L-26,-4 L-12,4 L0,-12 L12,4 L26,-4 L22,14 Z" fill="url(#diamondGrad)" stroke="#b45309" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.4))"/>

    <!-- Center Jewel (Brilliant Diamond) -->
    <polygon points="0,-2 6,6 0,14 -6,6" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
    
    <!-- Flawless 100% Sparkles -->
    <path d="M-20,-16 L-18,-10 L-12,-8 L-18,-6 L-20,0 L-22,-6 L-28,-8 L-22,-10 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M20,-16 L22,-10 L28,-8 L22,-6 L20,0 L18,-6 L12,-8 L18,-10 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 100% Banner at Bottom -->
  <g transform="translate(60,94)">
    <rect x="-24" y="-8" width="48" height="16" rx="8" fill="#78350f" stroke="#fde047" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">100%</text>
  </g>
</svg>
